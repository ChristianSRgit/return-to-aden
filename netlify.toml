# Deploy: this folder is the site. Netlify runs the build and serves `dist/`.
# Cloudflare Pages / GitHub Pages / Vercel work the same way — build
# `npm run build`, publish `dist`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app has no client-side routes; every path serves the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
